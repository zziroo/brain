<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pano</title>
<!-- Pano: Claude Code geçmiş panosu. Veri sözleşmesi pano/SEMA.md; bu dosya pano.mjs tarafından doldurulur. -->
<style>
/* Düzen: üstte marka şeridi ve kayan gösterge çizgili sekmeler, altında yapışkan tek satır filtre;
   içerik 12 sütunlu kart ızgarası. Kimlik: "bağlam penceresi" motifi (dolan pencere işareti, bağlam ölçerleri). */
:root {
  --zemin: #edf0f3;
  --yuzey: #fcfcfb;
  --yuzey-2: #f2f4f5;
  --yuzey-3: #e7eaed;
  --cizgi: rgba(11, 11, 11, .10);
  --izgara: #e1e0d9;
  --eksen: #c3c2b7;
  --metin: #0b0b0b;
  --metin-2: #52514e;
  --metin-3: #74726c;
  --vurgu: #2a78d6;
  --vurgu-zemin: rgba(42, 120, 214, .10);
  --vurgu-metin: #1c5cab;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --diger: #a3a29c;
  --iyi: #0ca30c; --uyari: #fab219; --ciddi: #ec835a; --kritik: #d03b3b;
  --iyi-metin: #006300; --kritik-metin: #b42f2f;
  --ipucu-zemin: rgba(252, 252, 251, .97);
  --golge: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .05);
  --golge-kalk: 0 14px 28px -12px rgba(16, 24, 40, .22), 0 3px 8px rgba(16, 24, 40, .06);
  --au1: rgba(42, 120, 214, .22);
  --au2: rgba(27, 175, 122, .16);
  --au3: rgba(235, 104, 52, .10);
  --yazi: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --kod: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --yaricap: 14px;
  --yay: cubic-bezier(.3, 1.35, .5, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --zemin: #0c0e11; --yuzey: #191a1c; --yuzey-2: #222427; --yuzey-3: #2b2d31;
    --cizgi: rgba(255, 255, 255, .09); --izgara: #2c2c2a; --eksen: #3e3e3b;
    --metin: #f5f5f3; --metin-2: #c3c2b7; --metin-3: #95938c;
    --vurgu: #3987e5; --vurgu-zemin: rgba(57, 135, 229, .16); --vurgu-metin: #86b6ef;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --diger: #6b6a65; --iyi-metin: #0ca30c; --kritik-metin: #e66767;
    --ipucu-zemin: rgba(30, 31, 34, .97);
    --golge: 0 1px 2px rgba(0, 0, 0, .3); --golge-kalk: 0 16px 32px -12px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .3);
    --au1: rgba(57, 135, 229, .20); --au2: rgba(25, 158, 112, .14); --au3: rgba(217, 89, 38, .10);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --zemin: #0c0e11; --yuzey: #191a1c; --yuzey-2: #222427; --yuzey-3: #2b2d31;
  --cizgi: rgba(255, 255, 255, .09); --izgara: #2c2c2a; --eksen: #3e3e3b;
  --metin: #f5f5f3; --metin-2: #c3c2b7; --metin-3: #95938c;
  --vurgu: #3987e5; --vurgu-zemin: rgba(57, 135, 229, .16); --vurgu-metin: #86b6ef;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --diger: #6b6a65; --iyi-metin: #0ca30c; --kritik-metin: #e66767;
  --ipucu-zemin: rgba(30, 31, 34, .97);
  --golge: 0 1px 2px rgba(0, 0, 0, .3); --golge-kalk: 0 16px 32px -12px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .3);
  --au1: rgba(57, 135, 229, .20); --au2: rgba(25, 158, 112, .14); --au3: rgba(217, 89, 38, .10);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--zemin); color: var(--metin);
  font: 14px/1.5 var(--yazi); padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  overflow-x: hidden;
}
h1, h2, h3, h4 { margin: 0; font-weight: 650; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; border-radius: 6px; }
code, .kod { font-family: var(--kod); font-size: .92em; }
.gizli-metin { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sayi { font-variant-numeric: tabular-nums; }

/* Arka plan aurorası: yalnız transform animasyonu (bileşik katman), azaltılmış harekette durur */
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; width: 58vmax; height: 58vmax; border-radius: 50%; opacity: 1; }
.aurora i:nth-child(1) { top: -30vmax; left: -12vmax; background: radial-gradient(closest-side, var(--au1), transparent 72%); animation: au1 36s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { top: -26vmax; right: -22vmax; background: radial-gradient(closest-side, var(--au2), transparent 72%); animation: au2 44s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { top: 30vh; left: 30vw; background: radial-gradient(closest-side, var(--au3), transparent 72%); animation: au3 52s ease-in-out infinite alternate; }
@keyframes au1 { to { transform: translate3d(14vw, 10vh, 0) scale(1.18); } }
@keyframes au2 { to { transform: translate3d(-16vw, 14vh, 0) scale(.9); } }
@keyframes au3 { to { transform: translate3d(-22vw, -18vh, 0) scale(1.25); } }

.kap { width: 100%; max-width: 1340px; margin-inline: auto; padding-inline: 16px; }
@media (min-width: 720px) { .kap { padding-inline: 24px; } }

/* Üst şerit */
.ust { padding-block: 18px 6px; }
.ust-ic { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.marka { display: flex; align-items: center; gap: 12px; min-width: 0; }
.marka svg { flex: none; }
.marka h1 { font-size: 22px; line-height: 1.1; }
.marka p { color: var(--metin-2); font-size: 12.5px; margin-top: 2px; }
.ust-sag { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cip { display: inline-block; max-width: min(100%, 340px); overflow: hidden; text-overflow: ellipsis; padding: 3px 9px; border-radius: 999px; background: var(--yuzey); border: 1px solid var(--cizgi); font-size: 12px; color: var(--metin-2); white-space: nowrap; vertical-align: middle; }
.cip b { color: var(--metin); font-weight: 600; margin-right: 5px; }
.cip b:last-child { margin-right: 0; }
.cip i { width: 8px; height: 8px; border-radius: 50%; background: var(--vurgu); display: inline-block; margin-right: 6px; vertical-align: 0; }
.dugme { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 9px; padding: 5px 10px; font-size: 12.5px; color: var(--metin); transition: background .2s, transform .2s; }
.dugme:hover { background: var(--yuzey-2); }
.dugme:active { transform: scale(.97); }
.dugme svg { width: 15px; height: 15px; }

/* Sekmeler */
.sekmeler-kap { position: relative; }
.sekmeler { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 6px 0; border-bottom: 1px solid var(--cizgi); }
.sekmeler::-webkit-scrollbar { display: none; }
.sekme { flex: none; border: 0; background: none; padding: 9px 12px 11px; font-size: 13.5px; font-weight: 550; color: var(--metin-2); border-radius: 8px 8px 0 0; transition: color .2s, background .2s; }
.sekme:hover { color: var(--metin); background: var(--vurgu-zemin); }
.sekme[aria-selected="true"] { color: var(--metin); }
.sekme-cizgi { position: absolute; bottom: -1px; left: 0; height: 2px; width: 10px; background: var(--vurgu); border-radius: 2px; transition: transform .45s var(--yay), width .45s var(--yay); pointer-events: none; }

/* Filtreler */
.filtre-kap { position: relative; z-index: 20; padding-block: 10px; }
@media (min-width: 900px) {
  .filtre-kap { position: sticky; top: env(safe-area-inset-top, 0px); }
  .filtre-kap.yapisti .filtreler { box-shadow: var(--golge-kalk); }
}
.filtreler { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 12px; padding: 8px 10px; transition: box-shadow .3s; }
.f-grup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.f-etiket { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--metin-3); font-weight: 600; }
.secim { display: inline-flex; flex-wrap: wrap; background: var(--yuzey-2); border-radius: 9px; padding: 2px; gap: 2px; }
.secim button { border: 0; background: transparent; padding: 4px 10px; border-radius: 7px; font-size: 12.5px; color: var(--metin-2); transition: background .2s, color .2s, box-shadow .2s; white-space: nowrap; }
.secim button:hover { color: var(--metin); }
.secim button[aria-pressed="true"] { background: var(--yuzey); color: var(--metin); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); font-weight: 600; }
.f-tarih { display: inline-flex; gap: 6px; align-items: center; }
.f-tarih input, .f-secim, .arama { border: 1px solid var(--cizgi); background: var(--yuzey-2); border-radius: 8px; padding: 4px 8px; font-size: 12.5px; min-width: 0; }
.f-tarih input { width: 9.6em; }
.f-ozet { margin-left: auto; font-size: 12px; color: var(--metin-3); }
.f-ac { display: none; }
@media (max-width: 639px) {
  .f-ac { display: inline-flex; }
  .filtreler:not(.acik) > .f-grup { display: none; }
  .filtreler.acik .f-ac { background: var(--vurgu-zemin); }
}
.f-sifirla { border: 0; background: none; color: var(--vurgu-metin); font-size: 12.5px; padding: 4px 6px; border-radius: 6px; }
.f-sifirla:hover { background: var(--vurgu-zemin); }
.acilir { position: relative; }
.acilir-panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; width: min(300px, calc(100vw - 32px)); background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 12px; box-shadow: var(--golge-kalk); padding: 8px; transform-origin: top left; animation: panel-ac .2s ease-out; }
@keyframes panel-ac { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.acilir-panel .liste { max-height: 300px; overflow: auto; margin-top: 6px; display: grid; gap: 1px; }
.acilir-panel label { display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 7px; font-size: 13px; cursor: pointer; }
.acilir-panel label:hover { background: var(--yuzey-2); }
.acilir-panel label span:last-child { margin-left: auto; color: var(--metin-3); font-size: 11.5px; }
.acilir-panel .ust-satir { display: flex; gap: 6px; align-items: center; }
.acilir-panel .ust-satir .arama { flex: 1; }

/* İçerik ızgarası ve kartlar */
main { padding-block: 8px 40px; min-height: 60vh; }
.bolum { display: none; }
.bolum.aktif { display: block; animation: bolum-gir .38s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes bolum-gir { from { opacity: 0; transform: translateY(8px); } }
.bolum-bas { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin: 14px 0 14px; }
.bolum-bas h2 { font-size: 21px; }
.bolum-bas p { color: var(--metin-2); font-size: 13px; max-width: 72ch; }
.izgara { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.izgara > * { grid-column: span 12; min-width: 0; }
@media (min-width: 760px) { .g-6, .g-4, .g-3 { grid-column: span 6 !important; } }
@media (min-width: 760px) and (max-width: 1099px) { .g-o12 { grid-column: span 12 !important; } }
@media (min-width: 1100px) {
  .g-8 { grid-column: span 8 !important; } .g-4 { grid-column: span 4 !important; }
  .g-3 { grid-column: span 3 !important; } .g-5 { grid-column: span 5 !important; } .g-7 { grid-column: span 7 !important; }
}
.kart { position: relative; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--yaricap); padding: 16px 18px 18px; box-shadow: var(--golge); min-width: 0; transition: box-shadow .35s, transform .45s var(--yay); }
.kart.kalkar:hover { transform: translateY(-3px); box-shadow: var(--golge-kalk); }
.gir { animation: gir .6s cubic-bezier(.2, .75, .25, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes gir { from { opacity: 0; transform: translateY(14px) scale(.985); } }
.kart-bas { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.kart-bas h3 { font-size: 14.5px; }
.kart-bas .alt { font-size: 12.5px; color: var(--metin-2); margin-top: 2px; max-width: 64ch; }
.kart-arac { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tablo-dugme { border: 1px solid transparent; background: none; color: var(--metin-3); font-size: 12px; padding: 3px 7px; border-radius: 7px; }
.tablo-dugme:hover { color: var(--metin); background: var(--yuzey-2); }
.tablo-dugme[aria-pressed="true"] { color: var(--vurgu-metin); border-color: var(--vurgu-zemin); background: var(--vurgu-zemin); }
.grafik { position: relative; min-width: 0; }
.grafik svg { display: block; overflow: visible; max-width: 100%; height: auto; }
.grafik canvas { display: block; }
.bos { color: var(--metin-3); font-size: 13px; padding: 28px 8px; text-align: center; }
.not { font-size: 12px; color: var(--metin-3); margin-top: 10px; }
.lejant { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--metin-2); margin-top: 10px; }
.lejant span { display: inline-flex; align-items: center; gap: 6px; }
.lejant i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.lejant i.cizgi { height: 2px; width: 14px; border-radius: 2px; }
.lejant .olcek { width: 120px; height: 10px; border-radius: 3px; }

/* KPI kutuları */
.kpiler { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .kpiler { grid-template-columns: repeat(var(--y, 4), minmax(0, 1fr)); } }
@media (min-width: 1180px) { .kpiler { grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); } }
.kpi { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.kpi .etiket { font-size: 12px; color: var(--metin-2); font-weight: 550; }
.kpi .deger { font-size: clamp(22px, 2.6vw, 29px); font-weight: 650; letter-spacing: -.02em; line-height: 1.15; white-space: nowrap; }
.kpi .ek { font-size: 11.5px; color: var(--metin-3); min-height: 1.4em; }
.kpi svg.kivilcim { margin-top: 6px; width: 100%; height: 30px; }
.kpi.vurgulu .deger { color: var(--metin); }

/* Çubuk listesi */
.cl { display: grid; gap: 4px; }
.cl-satir { display: grid; grid-template-columns: minmax(0, var(--ad-gen, 34%)) minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 3px 4px; border-radius: 7px; transition: background .2s; }
.cl-satir:hover, .cl-satir:focus-visible { background: var(--yuzey-2); }
.cl-satir[data-tik] { cursor: pointer; }
.cl-ad { font-size: 12.5px; color: var(--metin); overflow-wrap: anywhere; line-height: 1.3; }
.cl-ad small { display: block; color: var(--metin-3); font-size: 11px; }
.cl-ad.kod { font-family: var(--kod); font-size: 11.5px; }
.cl-iz { height: 14px; position: relative; }
.cl-cubuk { height: 100%; display: flex; gap: 2px; width: 0; min-width: 0; transition: width .95s var(--yay); }
.cl-cubuk > i { display: block; height: 100%; min-width: 0; transition: flex-grow .95s var(--yay), background .3s; }
.cl-cubuk > i:last-child { border-radius: 0 4px 4px 0; }
.cl-deger { font-size: 12px; color: var(--metin-2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cl-deger b { color: var(--metin); font-weight: 600; }
.cl-deger .hata { color: var(--kritik-metin); margin-left: 6px; }
@media (max-width: 520px) { .cl-satir { grid-template-columns: minmax(0, 1fr) auto; } .cl-iz { grid-column: 1 / -1; grid-row: 2; height: 8px; } }

/* Sütun histogramı */
.sutunlar { display: flex; align-items: flex-end; gap: 6px; height: var(--yuk, 170px); padding-top: 18px; }
.sutun { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; outline-offset: 1px; }
.sutun .govde { width: 100%; max-width: 24px; background: var(--renk, var(--s1)); border-radius: 4px 4px 0 0; height: 0; transition: height .95s var(--yay), background .3s; }
.sutun .ust-deger { font-size: 11px; color: var(--metin-2); margin-bottom: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sutun-etiketler { display: flex; gap: 6px; margin-top: 6px; border-top: 1px solid var(--eksen); padding-top: 5px; }
.sutun-etiketler span { flex: 1; min-width: 0; text-align: center; font-size: 11px; color: var(--metin-3); line-height: 1.25; overflow-wrap: anywhere; }

/* Tablolar */
.tablo-kap { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
table.tablo { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tablo th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--metin-2); padding: 7px 8px; border-bottom: 1px solid var(--eksen); white-space: nowrap; position: sticky; top: 0; background: var(--yuzey); }
.tablo th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; }
.tablo th[aria-sort] button { color: var(--metin); }
.tablo th .ok { opacity: .7; font-size: 10px; }
.tablo td { padding: 7px 8px; border-bottom: 1px solid var(--cizgi); vertical-align: top; overflow-wrap: anywhere; }
.tablo td.s, .tablo th.s { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablo tbody tr { transition: background .15s; }
.tablo tbody tr.tik { cursor: pointer; }
.tablo tbody tr.tik:hover, .tablo tbody tr.tik:focus-visible { background: var(--vurgu-zemin); outline: none; }
.tablo .baslik-h { font-weight: 550; color: var(--metin); max-width: 42ch; min-width: 170px; overflow-wrap: anywhere; }
.tablo .yol { min-width: 200px; display: inline-block; }
.tablo .baslik-h small { display: block; font-weight: 400; color: var(--metin-3); font-size: 11.5px; }
.tablo .yol { font-family: var(--kod); font-size: 11.5px; overflow-wrap: anywhere; }
.olcer { display: inline-block; width: 48px; height: 6px; border-radius: 3px; background: var(--yuzey-3); vertical-align: middle; margin-left: 6px; position: relative; overflow: hidden; }
.olcer i { position: absolute; inset: 0 auto 0 0; background: var(--vurgu); border-radius: 3px; }
.rozet { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; background: var(--yuzey-2); color: var(--metin-2); white-space: nowrap; }
.rozet.mac, .rozet.windows { border: 1px solid var(--cizgi); }
.rozet.zamanli { margin-left: 6px; background: var(--vurgu-zemin); color: var(--vurgu-metin); vertical-align: 1px; font-weight: 500; }
.model-nokta { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.daha { margin-top: 10px; }
.tablo-ust { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.tablo-ust .arama { width: min(340px, 100%); padding: 6px 10px; font-size: 13px; }

/* Rekorlar */
.rekorlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.rekor { border: 1px solid var(--cizgi); border-radius: 11px; padding: 10px 12px; background: var(--yuzey); transition: transform .4s var(--yay), box-shadow .3s, border-color .3s; min-width: 0; text-align: left; font: inherit; color: inherit; display: block; width: 100%; }

.rekor .r-et { font-size: 11.5px; color: var(--metin-3); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }

.rekor .r-not { font-size: 11px; color: var(--metin-3); margin-top: 2px; }

/* Proje kartları */
.projeler { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }

.proje svg { width: 100%; height: 36px; margin-top: 4px; }
.proje .p-pay { height: 4px; border-radius: 2px; background: var(--yuzey-3); overflow: hidden; margin-top: 6px; }
.proje .p-pay i { display: block; height: 100%; background: var(--vurgu); border-radius: 2px; width: 0; transition: width 1s var(--yay); }

/* İpucu */

.ipucu .ip-b { font-weight: 600; font-size: 12px; color: var(--metin-2); margin-bottom: 4px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

.ipucu .ip-s i { width: 12px; height: 2px; border-radius: 2px; display: inline-block; }
.ipucu .ip-s i.nokta { width: 8px; height: 8px; border-radius: 50%; }
.ipucu .ip-s b { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
.ipucu .ip-s span { color: var(--metin-2); overflow-wrap: anywhere; }
.ipucu .ip-n { color: var(--metin-2); margin-top: 5px; font-size: 12px; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 9.5em; overflow: hidden; }

/* SVG grafik ögeleri */
.ek-metin { fill: var(--metin-3); font-size: 11px; font-family: var(--yazi); }
.ek-metin.s { font-variant-numeric: tabular-nums; }
.izgara-c { stroke: var(--izgara); stroke-width: 1; shape-rendering: crispEdges; }
.eksen-c { stroke: var(--eksen); stroke-width: 1; shape-rendering: crispEdges; }
.artikil { stroke: var(--metin-3); stroke-width: 1; }
.hucre { transition: fill .6s ease, opacity .3s; }
.hucre.dalga { animation: hucre-gir .55s cubic-bezier(.2, .8, .3, 1.2) both; transform-box: fill-box; transform-origin: center; }

.dilim { transition: opacity .2s; cursor: default; }
.soluk { opacity: .25; }
.etiket-dis { fill: var(--metin-2); font-size: 11.5px; }

.geri { display: inline-flex; align-items: center; gap: 6px; color: var(--vurgu-metin); text-decoration: none; font-size: 13px; padding: 4px 8px; margin-left: -8px; border-radius: 8px; }

.oynat { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--vurgu); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 14px -4px var(--vurgu); transition: transform .3s var(--yay); flex: none; }

      V, meta, S, A, M, T, P, nS, nM, nA, kaynaklar, saatBilgi,
      sKaynak, sBasGun, sBitGun, sModel, sKova, sAnaModel, sIstemGun, sIstemSaat, sIstemHg, sAjanlar,
      aGun, aSaat, nK, kO, kA, kM, kH, kC, kG, kCk, kOo, kY, kMal, kGun, kSa, kHg,
      nT, tO, tA, tT, tN, tE, tGun, tSa, tM, aracModelVar,
      ilkMs, sonMs, ilkGun: gunNo(ilkMs), sonGun: gunNo(sonMs),
    };
  }

  // Filtre: { gun0, gun1 (dahil), kaynak (-1 = tümü), projeler (null | Set), model (-1 = tümü), zamanli ("dahil" | "haric" | "yalniz") }
  function gorunum(D, F) {
    const { S, A, nS, nM } = D, nP = D.P.length;
    const gun0 = F.gun0, gun1 = F.gun1, gunSay = Math.max(1, gun1 - gun0 + 1);
    const saatlik = gunSay <= 3;
    const binSay = saatlik ? gunSay * 24 : gunSay;
    const bin = saatlik ? (gn, sa) => (gn - gun0) * 24 + sa : (gn) => gn - gun0;
    const binMs = new Float64Array(binSay);
    for (let b = 0; b < binSay; b++) {
      if (!saatlik) { binMs[b] = gunBasMs(gun0 + b); continue; }
      const t = gunTarih(gun0 + Math.floor(b / 24));
      binMs[b] = new Date(t.getFullYear(), t.getMonth(), t.getDate(), b % 24).getTime();
    }
    const r0 = gunBasMs(gun0), r1 = gunBasMs(gun1 + 1);

    const sMask = new Uint8Array(nS);
    for (let s = 0; s < nS; s++) {
      const o = S[s];
      if (F.kaynak >= 0 && D.sKaynak[s] !== F.kaynak) continue;
      if (F.projeler && !F.projeler.has(o.proje)) continue;
      if (F.model >= 0 && !D.sModel[s * nM + F.model]) continue;
      if (F.zamanli === "haric" ? o.zamanli : F.zamanli === "yalniz" ? !o.zamanli : false) continue;
      sMask[s] = 1;
    }

    const bModelMal = new Float64Array(nM * binSay), bModelCagri = new Float64Array(nM * binSay), bModelCikis = new Float64Array(nM * binSay);
    const bG = new Float64Array(binSay), bC = new Float64Array(binSay), bO = new Float64Array(binSay), bY = new Float64Array(binSay);
    const bAna = new Float64Array(binSay), bAlt = new Float64Array(binSay), bMal = new Float64Array(binSay), bCagri = new Float64Array(binSay);
    const bProje = new Float64Array(Math.max(1, nP) * binSay);
    const gunMal = new Float64Array(gunSay), gunCagri = new Float64Array(gunSay), gunIstem = new Float64Array(gunSay);
    const hgCagri = new Float64Array(168), hgIstem = new Float64Array(168), hgMal = new Float64Array(168);
    const saatMap = new Map();
    const sMal = new Float64Array(nS), sCagri = new Float64Array(nS);
    const modelTop = Array.from({ length: nM }, () => ({ cagri: 0, g: 0, c: 0, o: 0, y: 0, mal: 0, ana: 0, alt: 0 }));
    const projeTop = Array.from({ length: nP }, () => ({ mal: 0, cagri: 0, cikis: 0, model: new Float64Array(nM), son: 0 }));
    const top = { cagri: 0, g: 0, c: 0, o: 0, y: 0, mal: 0, anaMal: 0, altMal: 0, anaCagri: 0, altCagri: 0 };
    const fm = F.model;
    for (let i = 0; i < D.nK; i++) {
      const s = D.kO[i];
      if (s < 0 || !sMask[s]) continue;
      const m = D.kM[i];
      if (fm >= 0 && m !== fm) continue;
      const gn = D.kGun[i];
      if (gn < gun0 || gn > gun1) continue;
      const b = bin(gn, D.kSa[i]);
      const c = D.kC[i], mal = D.kMal[i], g = D.kG[i], ck = D.kCk[i], oo = D.kOo[i], y = D.kY[i];
      top.cagri += c; top.g += g; top.c += ck; top.o += oo; top.y += y; top.mal += mal;
      if (D.kA[i]) { top.altMal += mal; top.altCagri += c; bAlt[b] += mal; } else { top.anaMal += mal; top.anaCagri += c; bAna[b] += mal; }
      bG[b] += g; bC[b] += ck; bO[b] += oo; bY[b] += y; bMal[b] += mal; bCagri[b] += c;
      if (m >= 0) {
        bModelMal[m * binSay + b] += mal; bModelCagri[m * binSay + b] += c; bModelCikis[m * binSay + b] += ck;
        const mt = modelTop[m]; mt.cagri += c; mt.g += g; mt.c += ck; mt.o += oo; mt.y += y; mt.mal += mal; if (D.kA[i]) mt.alt += mal; else mt.ana += mal;
      }
      const p = S[s].proje;
      if (p >= 0) { const pt = projeTop[p]; pt.mal += mal; pt.cagri += c; pt.cikis += ck; if (m >= 0) pt.model[m] += mal; bProje[p * binSay + b] += mal; const hm = D.kH[i] * SAAT + SAAT; if (hm > pt.son) pt.son = hm; }
      gunMal[gn - gun0] += mal; gunCagri[gn - gun0] += c;
      const hg = D.kHg[i] * 24 + D.kSa[i]; hgCagri[hg] += c; hgMal[hg] += mal;
      const h = D.kH[i]; saatMap.set(h, (saatMap.get(h) || 0) + c);
      sMal[s] += mal; sCagri[s] += c;
    }

    // Aralıkta etkin oturumlar
    const aktif = [], aktifMask = new Uint8Array(nS);
    let zamanliSay = 0;
    for (let s = 0; s < nS; s++) {
      if (!sMask[s]) continue;
      const o = S[s];
      if (sCagri[s] > 0 || (!D.sKova[s] && fm < 0 && o.basla < r1 && o.bitis >= r0)) { aktif.push(s); aktifMask[s] = 1; if (o.zamanli) zamanliSay++; }
    }

    // İnsan istemleri
    const bIstem = new Float64Array(binSay), bTurTop = new Float64Array(binSay), bTurSay = new Float64Array(binSay), bOturum = new Float64Array(binSay);
    const turlar = [], uzunluklar = [];
    let istemSay = 0, geceIstem = 0, aktifSn = 0;
    for (const s of aktif) {
      const o = S[s], ist = dizi(o.istemler), g = D.sIstemGun[s], sa = D.sIstemSaat[s], hg = D.sIstemHg[s];
      aktifSn += sayi(o.aktifSn);
      const bg = D.sBasGun[s];
      if (bg >= gun0 && bg <= gun1) bOturum[bin(bg, D.saatBilgi(Math.floor(o.basla / SAAT))[1])]++;
      for (let j = 0; j < ist.length; j++) {
        const gn = g[j];
        if (gn < gun0 || gn > gun1) continue;
        const b = bin(gn, sa[j]);
        istemSay++; bIstem[b]++; gunIstem[gn - gun0]++;
        hgIstem[hg[j] * 24 + sa[j]]++;
        if (sa[j] < 6) geceIstem++;
        const r = ist[j];
        const tur = sayi(r && r[2]);
        if (tur > 0) { turlar.push(tur); bTurTop[b] += tur; bTurSay[b]++; }
        uzunluklar.push(sayi(r && r[1]));
      }
    }

    // Araç kovaları: 7. sütun (modelIdx) varsa model filtresi kesin; yoksa oturum maskesiyle yaklaşık
    const nT = D.T.length, aracKesin = fm >= 0 && D.aracModelVar;
    const aracTop = Array.from({ length: nT }, () => ({ n: 0, e: 0, ana: 0, alt: 0 }));
    const bArac = new Float64Array(binSay);
    let aracSay = 0, hataSay = 0;
    for (let i = 0; i < D.nT; i++) {
      const s = D.tO[i];
      if (s < 0 || !sMask[s]) continue;
      if (aracKesin && D.tM[i] !== fm) continue;
      const gn = D.tGun[i];
      if (gn < gun0 || gn > gun1) continue;
      const n = D.tN[i], e = D.tE[i], at = aracTop[D.tT[i]];
      at.n += n; at.e += e; if (D.tA[i]) at.alt += n; else at.ana += n;
      aracSay += n; hataSay += e;
      bArac[bin(gn, D.tSa[i])] += n;
    }

    // Alt ajanlar
    const ajanlar = [], bAjan = new Float64Array(binSay);
    for (let i = 0; i < D.nA; i++) {
      const a = A[i];
      if (a.oturum < 0 || !sMask[a.oturum]) continue;
      if (fm >= 0 && a.model !== fm) continue;
      const gn = D.aGun[i];
      if (gn < gun0 || gn > gun1) continue;
      ajanlar.push(i); bAjan[bin(gn, D.aSaat[i])]++;
    }
    const es = eszamanlilik(A, ajanlar);

    return {
      F, gun0, gun1, gunSay, saatlik, binSay, binMs, r0, r1, sMask, aktif, aktifMask, zamanliSay,
      bModelMal, bModelCagri, bModelCikis, bG, bC, bO, bY, bAna, bAlt, bMal, bCagri, bProje,
      gunMal, gunCagri, gunIstem, hgCagri, hgIstem, hgMal, saatMap, sMal, sCagri, modelTop, projeTop, top,
      bIstem, bTurTop, bTurSay, bOturum, turlar, uzunluklar, istemSay, geceIstem, aktifSn,
      aracTop, bArac, aracSay, hataSay, aracYaklasik: fm >= 0 && !D.aracModelVar, ajanlar, bAjan, eszamanli: es,
    };
  }

  // Eşzamanlı ajan sayısı: süpürme
  function eszamanlilik(A, idx) {
    const ev = [];
    for (const i of idx) { const a = A[i]; ev.push([a.basla, 1], [Math.max(a.bitis, a.basla + 1000), -1]); }
    ev.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
    let n = 0, zirve = 0, zirveT = 0;
    const seri = [];
    for (const [t, d] of ev) {
      n += d;
      if (seri.length && seri[seri.length - 1][0] === t) seri[seri.length - 1][1] = n; else seri.push([t, n]);
      if (n > zirve) { zirve = n; zirveT = t; }
    }
    return { seri, zirve, zirveT };
  }

  function medyan(arr) {
    if (!arr.length) return 0;
    const a = Float64Array.from(arr).sort(); const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  function rekorlar(D, G) {
    const S = D.S;
    let uzun = -1, pahali = -1;
    for (const s of G.aktif) {
      if (uzun < 0 || sayi(S[s].aktifSn) > sayi(S[uzun].aktifSn)) uzun = s;
      if (G.sMal[s] > (pahali < 0 ? 0 : G.sMal[pahali])) pahali = s;
    }
    let gun = -1, gunV = 0;
    for (let i = 0; i < G.gunSay; i++) if (G.gunMal[i] > gunV) { gunV = G.gunMal[i]; gun = G.gun0 + i; }
    let saat = -1, saatV = 0;
    for (const [h, v] of G.saatMap) if (v > saatV) { saatV = v; saat = h; }
    let enUzunSeri = 0, seri = 0, seriBit = -1, simdiki = 0;
    for (let i = 0; i < G.gunSay; i++) {
      if (G.gunCagri[i] > 0 || G.gunIstem[i] > 0) { seri++; if (seri > enUzunSeri) { enUzunSeri = seri; seriBit = G.gun0 + i; } } else seri = 0;
    }
    simdiki = seri;
    let hgEn = 0, hgV = 0;
    for (let i = 0; i < 168; i++) if (G.hgIstem[i] > hgV) { hgV = G.hgIstem[i]; hgEn = i; }
    return {
      enUzun: uzun, enPahali: pahali, enPahaliMal: pahali >= 0 ? G.sMal[pahali] : 0, enPahaliGun: gun, enPahaliGunMal: gunV, enYogunSaat: saat, enYogunSaatCagri: saatV,
      geceOran: G.istemSay ? G.geceIstem / G.istemSay : 0, enUzunSeri, seriBit, simdikiSeri: simdiki,
      enYogunHg: hgV ? hgEn : -1, enYogunHgIstem: hgV,
    };
  }

  // Geçişleri iki sütunlu akış için hazırlar: en yoğun araçlar + "Diğer" (-3)
  function gecisOzet(liste, enCok = 9) {
    const hacim = new Map();
    for (const r of liste) { if (!Array.isArray(r)) continue; const [a, b, v] = r; if (a >= 0) hacim.set(a, (hacim.get(a) || 0) + sayi(v)); if (b >= 0) hacim.set(b, (hacim.get(b) || 0) + sayi(v)); }
    const secili = [...hacim].sort((x, y) => y[1] - x[1]).slice(0, enCok).map((x) => x[0]);
    const sec = new Set(secili), baglar = new Map();
    for (const r of liste) {
      if (!Array.isArray(r)) continue;
      let a = Number(r[0]), b = Number(r[1]); const v = sayi(r[2]);
      if (!Number.isInteger(a) || !Number.isInteger(b) || v <= 0) continue;
      if (a >= 0 && !sec.has(a)) a = -3; if (b >= 0 && !sec.has(b)) b = -3;
      if (a === -2 || b === -1) continue; // iki sütunlu düzende Yanıt kaynak, İstem hedef olamaz
      const k = a + "," + b; baglar.set(k, (baglar.get(k) || 0) + v);
    }
    return { secili, gecis: [...baglar].map(([k, v]) => { const [a, b] = k.split(",").map(Number); return [a, b, v]; }) };
  }

  // Akışlar
  function akis(D, G, enCok = 9) {
    const S = D.S, T = D.T;
    const gec = new Map();
    const birlestir = (hedef, kaynak) => { const o = nesne(kaynak); for (const k in o) hedef.set(k, (hedef.get(k) || 0) + sayi(o[k])); };
    const komut = new Map(), alan = new Map(), beceri = new Map();
    for (const s of G.aktif) {
      for (const r of dizi(S[s].gecisler)) {
        if (!Array.isArray(r)) continue;
        const k = r[0] + "," + r[1]; gec.set(k, (gec.get(k) || 0) + sayi(r[2]));
      }
      birlestir(komut, S[s].komutlar); birlestir(alan, S[s].alanlar); birlestir(beceri, S[s].beceriler);
    }
    const { gecis, secili } = gecisOzet([...gec].map(([k, v]) => { const [a, b] = k.split(",").map(Number); return [a, b, v]; }), enCok);

    // Araç sıralaması
    const araclar = G.aracTop.map((x, i) => ({ i, ad: T[i], ...x })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
    const mcp = new Map();
    for (const a of araclar) {
      if (!a.ad.startsWith("mcp__")) continue;
      const p = a.ad.split("__"); const sv = p[1] || "?";
      const v = mcp.get(sv) || { n: 0, e: 0, araclar: new Map() };
      v.n += a.n; v.e += a.e; v.araclar.set(p.slice(2).join("__") || "?", a.n); mcp.set(sv, v);
    }
    // Orkestrasyon: ana model -> ajan türü -> ajan modeli
    const ork = new Map();
    for (const i of G.ajanlar) {
      const a = D.A[i]; const am = D.sAnaModel[a.oturum];
      const k = JSON.stringify([am, String(a.tur == null ? "?" : a.tur), Number.isInteger(a.model) ? a.model : -1]);
      const v = ork.get(k) || { n: 0, mal: 0 }; v.n++; v.mal += sayi(a.maliyet); ork.set(k, v);
    }
    const sirala = (m) => [...m].sort((a, b) => b[1] - a[1]);
    return { gecis, secili, araclar, mcp: [...mcp].sort((a, b) => b[1].n - a[1].n), komut: sirala(komut), alan: sirala(alan), beceri: sirala(beceri), ork };
  }

  function ajanHesap(D, G) {
    const A = D.A;
    const tm = new Map();
    const sureler = [];
    let arka = 0, on = 0, bilinmez = 0, wt = 0, mal = 0, sureTop = 0;
    for (const i of G.ajanlar) {
      const a = A[i]; const tur = a.tur == null ? "?" : String(a.tur);
      const v = tm.get(tur) || { n: 0, mal: 0, model: new Map() };
      v.n++; v.mal += sayi(a.maliyet); const mk = Number.isInteger(a.model) ? a.model : -1; v.model.set(mk, (v.model.get(mk) || 0) + 1); tm.set(tur, v);
      const sn = Math.max(0, (a.bitis - a.basla) / 1000); sureler.push(sn); sureTop += sn;
      if (a.arkaPlan === true) arka++; else if (a.arkaPlan === false) on++; else bilinmez++;
      if (a.izolasyon) wt++;
      mal += sayi(a.maliyet);
    }
    const pahali = [...G.ajanlar].sort((x, y) => sayi(A[y].maliyet) - sayi(A[x].maliyet)).slice(0, 15);
    // Gantt şeritleri: açgözlü yerleştirme
    const sirali = [...G.ajanlar].sort((x, y) => A[x].basla - A[y].basla);
    const seritSon = [], serit = new Map();
    for (const i of sirali) {
      const a = A[i]; let k = seritSon.findIndex((t) => t <= a.basla);
      if (k < 0) { k = seritSon.length; seritSon.push(0); }
      seritSon[k] = Math.max(a.bitis, a.basla + 30000); serit.set(i, k);
    }
    return { turlar: [...tm].sort((a, b) => b[1].n - a[1].n), sureler, arka, on, bilinmez, wt, mal, sureTop, ortSure: sureler.length ? sureTop / sureler.length : 0, medyanSure: medyan(sureler), pahali, serit, seritSay: seritSon.length };
  }

  function aliskanlik(D, G) {
    const S = D.S;
    const topla = (hedef, kaynak) => { const o = nesne(kaynak); for (const k in o) hedef.set(k, (hedef.get(k) || 0) + sayi(o[k])); };
    const efor = new Map(), izin = new Map(), giris = new Map();
    let kesinti = 0, ret = 0, hata = 0, apiHata = 0, gorsel = 0, dBlok = 0, dMs = 0, dMsBlok = 0, dMsOturum = 0, sikistirma = 0;
    const surumler = new Map();
    for (const s of G.aktif) {
      const o = S[s];
      topla(efor, o.efor); topla(izin, o.izin);
      if (o.giris) giris.set(String(o.giris), (giris.get(String(o.giris)) || 0) + 1);
      kesinti += sayi(o.kesinti); ret += sayi(o.ret); hata += sayi(o.hata); apiHata += sayi(o.apiHata); gorsel += sayi(o.gorsel);
      // dusunme.ms eski sürümlerde (Windows arşivi) yok ve 0 gelir: 0 = veri yok, sıfır süre değil
      const d = nesne(o.dusunme); dBlok += sayi(d.blok);
      if (sayi(d.ms) > 0) { dMs += d.ms; dMsBlok += sayi(d.blok); dMsOturum++; }
      sikistirma += dizi(o.sikistirma).length;
      if (o.surum) { const v = surumler.get(String(o.surum)) || []; v.push(s); surumler.set(String(o.surum), v); }
    }
    return { efor, izin, giris, kesinti, ret, hata, apiHata, gorsel, dBlok, dMs, dMsBlok, dMsOturum, sikistirma, surumler };
  }

  function kelimeler(D, G, enCok = 70) {
    const S = D.S, say = new Map();
    const desen = /[\p{L}][\p{L}\p{N}'’-]{2,}/gu;
    let istemN = 0;
    for (const s of G.aktif) {
      const ist = dizi(S[s].istemler), g = D.sIstemGun[s];
      for (let j = 0; j < ist.length; j++) {
        if (g[j] < G.gun0 || g[j] > G.gun1) continue;
        const m = ist[j] && ist[j][3];
        if (typeof m !== "string" || !m) continue;
        istemN++;
        const temiz = m.replace(/https?:\/\/\S+/g, " ").replace(/<[^>]{0,60}>/g, " ").toLocaleLowerCase("tr-TR");
        const gorulen = new Set();
        for (const k of temiz.matchAll(desen)) {

          if (w.length < 3 || DURAK.has(w) || /^\d/.test(w) || w.length > 24) continue;
          if (gorulen.has(w)) continue; // aynı istemde tekrar sayılmaz
          gorulen.add(w); say.set(w, (say.get(w) || 0) + 1);
        }

  // ======================= Oturum ayrıntısı ve replay =======================
  const OLAY_AD = { i: "İstem", y: "Yanıt", a: "Araç", x: "Araç hatası", g: "Alt ajan başladı", s: "Bağlam sıkıştırıldı", k: "Kullanıcı kesintisi", e: "API hatası" };

  function replayKur(sahne, panel, kontrol, si) {
    const o = D.S[si], basla = o.basla, dur = Math.max(1, (o.bitis - basla) / 1000);
    const olay = [];

    const seritSon = [];

    const seritSay = Math.max(1, seritSon.length);

    const akis = olay.concat(aj.map((x) => ({ t: x.bit, k: "G", a: x }))).sort((a, b) => a.t - b.t);
    const zaman = [0, dur]; for (const e of olay) zaman.push(e.t); for (const p of egri) zaman.push(p[0]); for (const x of aj) zaman.push(x.bas, x.bit);
    const ZS = H.zamanEsle(zaman), son = enBuyuk(zaman, null, dur);
    const ZD = { ileri: (x) => x, geri: (x) => x, toplam: son, bosluk: [] };
    let sik = ZS.toplam < son * .8;
    const Z = () => (sik ? ZS : ZD);
    let ctxMaks = enBuyuk(egri, (p) => p[1], Math.max(o.zirveBaglam || 0, 1));
    const ctxTik = H.guzelAdim(ctxMaks, 3);
    // ---- yerleşim ----
    let W, HH, L, tv, arka, pw;
    const SOL = 92, SAG = 14;
    function yerlesim() {
      W = Math.max(300, Math.floor(sahne.clientWidth || 700));
      const sh = sinirla(Math.floor(120 / seritSay), 5, 13);
      L = {};
      let y = 22;
      L.ctx = [y, 92]; y += 92 + 10;
      L.ist = [y, 16]; y += 16;
      L.kat = []; for (let k = 0; k < 6; k++) { L.kat.push([y, 12]); y += 12; }
      L.yan = [y, 14]; y += 14 + 10;
      L.ajan = [y, sh * seritSay]; L.sh = sh; y += sh * seritSay + 8;
      L.eksen = y; y += 22;
      HH = y; pw = W - SOL - SAG;
      if (tv) tv.c.remove();

      tv.c.tabIndex = 0; tv.c.setAttribute("role", "img");
      tv.c.setAttribute("aria-label", "Oturum zaman çizelgesi. Boşluk tuşu oynatır, ok tuşları ileri geri sarar.");
      sahne.appendChild(tv.c);
      olaylariBagla();
      arkaCiz();
    }
    const xOf = (t) => SOL + (Z().ileri(t) / (Z().toplam || 1)) * pw;
    const ctxY = (v) => L.ctx[0] + L.ctx[1] - (v / ctxTik.maks) * L.ctx[1];
    function satirY(e) {
      if (e.k === "i") return L.ist[0] + L.ist[1] / 2;
      if (e.k === "a" || e.k === "x") { const k = aracKategori(D.T[e.a]); return L.kat[k][0] + L.kat[k][1] / 2; }
      if (e.k === "y" || e.k === "k" || e.k === "e") return L.yan[0] + L.yan[1] / 2;
      if (e.k === "s") return L.ctx[0] + 8;
      return L.ajan[0] + 4;
    }
    let R = {};
    function renkler() {
      R = { metin: cssRenk("--metin"), m2: cssRenk("--metin-2"), m3: cssRenk("--metin-3"), izgara: cssRenk("--izgara"), eksen: cssRenk("--eksen"), yuzey: cssRenk("--yuzey"), y2: cssRenk("--yuzey-2"), vurgu: cssRenk("--vurgu"), kritik: cssRenk("--kritik"), uyari: cssRenk("--uyari"), kat: KATEGORI.map((k) => cssRenk(k.renk)), font: getComputedStyle(doc.body).fontFamily };
    }
    function egriYol(c, bitisX) {

    const kullanilan = D.M.map((m, i) => i).filter((i) => { for (let k = 0; k < D.nK; k++) if (D.kM[k] === i) return true; return false; });
    modelSel = h("select", { class: "f-secim", id: "f-model", "aria-label": "Model" }, h("option", { value: "-1", text: "Tüm modeller" }), modelSirasi(kullanilan).map((i) => h("option", { value: String(i), text: D.M[i].ad })));
    modelSel.addEventListener("change", () => { FD.model = +modelSel.value; uygula(); });
    kap.appendChild(h("div", { class: "f-grup" }, h("span", { class: "f-etiket", text: "Model" }), modelSel));
    if (D.S.some((o) => o.zamanli)) {
      zamanliSec = secim([{ deger: "dahil", ad: "Dahil" }, { deger: "haric", ad: "Hariç" }, { deger: "yalniz", ad: "Yalnız" }], FD.zamanli, (v) => { FD.zamanli = v; uygula(); }, "Zamanlanmış görevler");
      kap.appendChild(h("div", { class: "f-grup" }, h("span", { class: "f-etiket", text: "Zamanlanmış görevler", title: "Zamanlanmış görev (ör. gözcü) oturumları" }), zamanliSec));
    }
    sifirlaEl = h("button", { class: "f-sifirla", type: "button", hidden: true, onclick: filtreSifirla }, "Sıfırla");
    ozetEl = h("span", { class: "f-ozet", "aria-live": "polite" });
    kap.append(sifirlaEl, ozetEl);
    projeEtiket();
  }
  function filtreSifirla() {
    Object.assign(FD, { aralik: "tum", kaynak: -1, projeler: null, model: -1, zamanli: "dahil" });
    tarihSec.ayarla("tum"); ozelKap.hidden = true; if (kaynakSec) kaynakSec.ayarla(-1); if (zamanliSec) zamanliSec.ayarla("dahil"); modelSel.value = "-1";
    projeEtiket(); if (projePanel) projeKapat();

  }
  function projeEtiket() {
    const n = FD.projeler ? FD.projeler.size : 0;
    const ad = n === 0 ? "Tüm projeler" : n === 1 ? projeAdi([...FD.projeler][0]) : n + " proje";
    projeDugme.textContent = kisalt(ad, 28); projeDugme.title = ad;
    projeDugme.appendChild(h("span", { "aria-hidden": "true", text: " ▾", style: "color:var(--metin-3)" }));
  }
  function projeAc(acilir) {
    const say = new Map(); for (const o of D.S) say.set(o.proje, (say.get(o.proje) || 0) + 1);
    const ara = h("input", { class: "arama", type: "search", placeholder: "Proje ara", "aria-label": "Proje ara" });
    const liste = h("div", { class: "liste", role: "group", "aria-label": "Projeler" });
    const sirali = D.P.map((ad, i) => i).sort((a, b) => (say.get(b) || 0) - (say.get(a) || 0));
    const kutular = sirali.map((i) => {
      const k = h("input", { type: "checkbox", value: String(i) });

      k.addEventListener("change", () => {
        const set = new Set(FD.projeler || []);

      });
      const lb = h("label", { title: D.P[i] }, k, h("span", { text: kisalt(D.P[i], 60), style: "overflow-wrap:anywhere" }), h("span", { text: fSayi(say.get(i) || 0) }));
      liste.appendChild(lb); return [lb, D.P[i].toLocaleLowerCase("tr-TR")];
    });
    ara.addEventListener("input", () => { const q = ara.value.toLocaleLowerCase("tr-TR"); for (const [lb, ad] of kutular) lb.hidden = q && !ad.includes(q); });
    const tumu = h("button", { class: "f-sifirla", type: "button", onclick: () => { FD.projeler = null; for (const [lb] of kutular) lb.querySelector("input").checked = false; projeEtiket(); uygula(); } }, "Tümü");
    projePanel = h("div", { class: "acilir-panel", role: "dialog", "aria-label": "Proje seçimi" }, h("div", { class: "ust-satir" }, ara, tumu), liste);
    projePanel.addEventListener("click", (e) => e.stopPropagation());

    projeDugme.setAttribute("aria-expanded", "true");
    ara.focus();
  }
  function projeKapat() { if (projePanel) { projePanel.remove(); projePanel = null; projeDugme.setAttribute("aria-expanded", "false"); } }
  doc.addEventListener("click", projeKapat);
  doc.addEventListener("keydown", (e) => { if (e.key === "Escape" && projePanel) { projeKapat(); projeDugme.focus(); } });
  function filtreOzet() {
    sifirlaEl.hidden = varsayilanMi();
    const n = (FD.aralik !== "tum") + (FD.kaynak >= 0) + !!(FD.projeler && FD.projeler.size) + (FD.model >= 0) + (FD.zamanli !== "dahil");
    acDugme.textContent = n ? "Filtreler (" + n + ")" : "Filtreler";
    let t = `${aralikMetni(G.r0, G.r1 - 1)} · ${fSayi(G.aktif.length)} oturum`;
    if (aktifId === "oturum") t = "Oturum ayrıntısı filtrelerden bağımsızdır";
    ozetEl.textContent = t;
  }
  function projeyeOdaklan(pi) {
    FD.projeler = new Set([pi]); projeEtiket(); uygula();
    bildirim("Filtre: " + projeAdi(pi));
    if (location.hash !== "#oturumlar") location.hash = "#oturumlar";
  }

  // ---------- Sekmeler ve yönlendirme ----------
  let sekmeDugmeleri = [];
  function sekmeKur() {
    const kap = $("#sekmeler");
    sekmeDugmeleri = BOLUMLER.map((b, i) => {
      const d = h("button", { class: "sekme", role: "tab", id: "sekme-" + b.id, "aria-controls": "b-" + b.id, "aria-selected": "false", tabindex: "-1", type: "button", text: b.ad });
      d.addEventListener("click", () => { if (location.hash !== "#" + b.id) location.hash = "#" + b.id; else goster(b.id); });
      d.addEventListener("keydown", (e) => {
        let j = -1;
        if (e.key === "ArrowRight") j = (i + 1) % BOLUMLER.length; else if (e.key === "ArrowLeft") j = (i - 1 + BOLUMLER.length) % BOLUMLER.length;
        else if (e.key === "Home") j = 0; else if (e.key === "End") j = BOLUMLER.length - 1;
        if (j >= 0) { e.preventDefault(); sekmeDugmeleri[j].focus(); location.hash = "#" + BOLUMLER[j].id; }
      });
      kap.appendChild(d); return d;
    });
    for (const b of BOLUMLER) { const el = h("section", { class: "bolum", id: "b-" + b.id, role: "tabpanel", "aria-labelledby": "sekme-" + b.id, tabindex: "-1" }); main.appendChild(el); durum[b.id] = { el, kuruldu: false, surum: -1 }; }
    durum.oturum = { el: h("section", { class: "bolum", id: "b-oturum", "aria-label": "Oturum ayrıntısı" }) };
    main.appendChild(durum.oturum.el);
  }
  function cizgiTasi() {
    const i = BOLUMLER.findIndex((b) => b.id === (aktifId === "oturum" ? "oturumlar" : aktifId));
    const cz = $("#sekme-cizgi"); if (i < 0) return;
    const d = sekmeDugmeleri[i];
    cz.style.width = d.offsetWidth - 16 + "px"; cz.style.transform = `translateX(${d.offsetLeft + 8}px)`;
  }
  function bolumCiz(id) {
    const d = durum[id], b = BOLUMLER.find((x) => x.id === id);
    if (!d.kuruldu) { kartSira = 0; b.m.kur(d.el); d.kuruldu = true; }
    if (d.surum !== surum) {
      const t0 = performance.now();
      try { b.m.guncelle(); } catch (e) { console.error("Pano: " + id + " çizilemedi", e); d.el.appendChild(h("p", { class: "bos", text: "Bu bölüm çizilirken hata oluştu: " + (e && e.message) })); }
      d.surum = surum;
      const ms = performance.now() - t0; if (ms > 150) console.info(`Pano: ${id} ${ms.toFixed(0)} ms`);
    }
  }
  function goster(id, param) {
    ipucuGizle();
    if (id !== "oturum") detayNesil++;
    if (aktifId === "oturum" && id !== "oturum" && aktifReplay) { aktifReplay.temizle(); aktifReplay = null; }
    const onceki = aktifId;
    aktifId = id;
    for (const k in durum) durum[k].el.classList.toggle("aktif", k === id);
    sekmeDugmeleri.forEach((d, i) => { const sec = BOLUMLER[i].id === id; d.setAttribute("aria-selected", String(sec)); d.tabIndex = sec || (id === "oturum" && BOLUMLER[i].id === "oturumlar") ? 0 : -1; });
    cizgiTasi();
    const as = sekmeDugmeleri[BOLUMLER.findIndex((b) => b.id === (id === "oturum" ? "oturumlar" : id))];
    if (as) { const k = as.parentElement; if (as.offsetLeft < k.scrollLeft || as.offsetLeft + as.offsetWidth > k.scrollLeft + k.clientWidth) k.scrollTo({ left: as.offsetLeft - 16, behavior: azHareket ? "auto" : "smooth" }); }
    filtreOzet();
    if (id === "oturum") oturumDetay(durum.oturum.el, param);
    else bolumCiz(id);
    parcaciklariUyandir();
    const hedef = $(".sekmeler-kap").getBoundingClientRect().top + scrollY - 4;
    if (onceki && onceki !== id && scrollY > hedef) scrollTo({ top: hedef, behavior: "auto" });
    doc.title = (id === "oturum" ? "Oturum" : BOLUMLER.find((b) => b.id === id).ad) + " · Pano";
  }
  function rota() {
    const hs = location.hash.replace(/^#/, "");
    if (hs.startsWith("oturum/")) goster("oturum", hs.slice(7));
    else goster(BOLUMLER.some((b) => b.id === hs) ? hs : "genel");
  }

  // ---------- Tema ----------
  const TEMA_AD = { sistem: "Sistem", light: "Açık", dark: "Koyu" };
  let tema = "sistem";
  try { const t = localStorage.getItem("pano-tema"); if (t === "light" || t === "dark") tema = t; } catch (e) { /* depolama yok */ }
  function temaUygula(ilk) {
    if (tema === "sistem") doc.documentElement.removeAttribute("data-theme"); else doc.documentElement.setAttribute("data-theme", tema);
    const d = $("#tema-dugme");
    bosalt(d);
    const ik = s("svg", { viewBox: "0 0 16 16", "aria-hidden": "true" });
    if (tema === "dark") ik.appendChild(s("path", { d: "M12.5 10.2A5.5 5.5 0 0 1 5.8 3.5a5.5 5.5 0 1 0 6.7 6.7z", style: { fill: "currentColor" } }));
    else if (tema === "light") { ik.appendChild(s("circle", { cx: 8, cy: 8, r: 3.2, style: { fill: "currentColor" } })); for (let i = 0; i < 8; i++) { const a = (i * Math.PI) / 4; ik.appendChild(s("line", { x1: 8 + Math.cos(a) * 5, y1: 8 + Math.sin(a) * 5, x2: 8 + Math.cos(a) * 6.8, y2: 8 + Math.sin(a) * 6.8, style: { stroke: "currentColor", strokeWidth: 1.4, strokeLinecap: "round" } })); } }
    else { ik.appendChild(s("circle", { cx: 8, cy: 8, r: 6, style: { fill: "none", stroke: "currentColor", strokeWidth: 1.4 } })); ik.appendChild(s("path", { d: "M8 2a6 6 0 0 1 0 12z", style: { fill: "currentColor" } })); }
    d.append(ik, h("span", { text: TEMA_AD[tema] }));
    d.setAttribute("aria-label", "Tema: " + TEMA_AD[tema] + ". Değiştirmek için tıklayın");
    if (!ilk) temaYenile();
  }
  function temaYenile() {
    renkSifirla(); surum++; onb.clear();
    if (aktifId === "oturum") { if (aktifReplay) aktifReplay.tema(); }
    else if (aktifId) bolumCiz(aktifId);
  }
  $("#tema-dugme").addEventListener("click", () => {
    tema = tema === "sistem" ? (koyuMu() ? "light" : "dark") : tema === "light" ? "dark" : "sistem";
    try { if (tema === "sistem") localStorage.removeItem("pano-tema"); else localStorage.setItem("pano-tema", tema); } catch (e) { /* depolama yok */ }
    temaUygula(false);
  });
  if (window.matchMedia) { const mq = matchMedia("(prefers-color-scheme: dark)"); const f = () => { if (tema === "sistem") temaYenile(); }; if (mq.addEventListener) mq.addEventListener("change", f); }

  // ---------- Açılış ----------
  function veriYok(baslik, metin) {
    $(".sekmeler-kap").hidden = true; $("#filtre-kap").hidden = true;
    bosalt(main).appendChild(h("div", { class: "kart veri-yok" }, h("h2", { text: baslik }), h("p", { text: metin }), h("code", { text: "node pano.mjs" })));
  }
  temaUygula(true);
  $("#atla").addEventListener("click", () => main.focus());
  addEventListener("scroll", () => $("#filtre-kap").classList.toggle("yapisti", scrollY > 120), { passive: true });
  let V = null;
  const t0 = performance.now();
  try {
    const el = $("#pano-veri"), ham = el ? el.textContent.trim() : "";
    if (!ham || ham === "__PANO" + "_VERI__") { veriYok("Veri yok", "Bu şablon henüz doldurulmadı. Panoyu üretmek için orchestration-report klasöründe şunu çalıştırın:"); return; }
    V = JSON.parse(ham);
  } catch (e) { veriYok("Veri okunamadı", "Gömülü JSON ayrıştırılamadı (" + (e && e.message) + "). Panoyu yeniden üretin:"); return; }
  const tAyr = performance.now() - t0;
  D = H.hazirla(V);
  modelSlotKur(D.M);
  const idSay = new Map(); for (const o of D.S) idSay.set(String(o.id), (idSay.get(String(o.id)) || 0) + 1);
  D._ciftId = new Set([...idSay].filter((x) => x[1] > 1).map((x) => x[0]));
  if (!D.nS && !D.nK) { veriYok("Veri yok", "Pano üretildi ama içinde oturum yok. Kaynak klasörlerini kontrol edip yeniden üretin:"); return; }
  // Üst bilgi
  $("#ust-alt").textContent = `Claude Code geçmişi · ${new Date(D.ilkMs).getFullYear() === new Date(D.sonMs).getFullYear() ? dfGun.format(D.ilkMs) + " – " + dfGunYil.format(D.sonMs) : dfGunYil.format(D.ilkMs) + " – " + dfGunYil.format(D.sonMs)} · ${fSayi(D.nS)} oturum`;
  const kc = $("#kaynak-cipler");
  for (const k of Array.isArray(D.meta.kaynaklar) ? D.meta.kaynaklar : []) kc.appendChild(h("span", { class: "cip", title: String(k.ad) + (k.kok ? " · " + String(k.kok) : "") }, h("i"), h("b", { text: String(k.ad) }), (k.dosya != null ? fSayi(k.dosya) + " dosya" : "")));
  const mf = D.meta.filtre;
  if (mf && typeof mf === "object" && (mf.since || mf.until || mf.kaynak || mf.metinsiz)) {
    const p = [mf.since ? "başlangıç " + mf.since : null, mf.until ? "bitiş " + mf.until : null, mf.kaynak ? "yalnız " + mf.kaynak + " kaynağı" : null, mf.metinsiz ? "metinsiz (istem metinleri yok)" : null].filter(Boolean);
    $(".ust-ic").after(h("div", { class: "kap", style: "margin-top:10px" }, h("div", { class: "uyari-kutu", role: "note" }, h("span", null, h("b", { text: "Bu pano süzgeçle üretildi: " }), p.join(" · ") + ". Kapsam dışındaki kayıtlar burada yok."))));
  }
  const alt = $("#alt-bilgi");
  ekle(alt, [
    h("span", { text: "Üretildi: " + (D.meta.uretildi ? dfTam.format(D.meta.uretildi) : "?") + (D.meta.sureMs ? " · toplama " + fSure(D.meta.sureMs / 1000) : "") }),
    h("span", { text: String(D.meta.fiyatNotu || "") }),
    V.ozet ? h("span", { text: `Doğrulama: ${fSayi(V.ozet.cagri)} çağrı · ${fPara(V.ozet.maliyet)} · ${fSayi(V.ozet.oturum)} oturum · ${fSayi(V.ozet.ajan)} ajan` }) : null,
    D.meta.metinler === false ? h("span", { text: "Metinsiz üretildi: istem metinleri gizli." }) : null,
    h("span", { text: "Saatler bu tarayıcının saat diliminde (" + (Intl.DateTimeFormat().resolvedOptions().timeZone || "yerel") + ")." }),
  ]);
  sekmeKur();
  filtreKur();
  F = filtreHesapla(); G = H.gorunum(D, F); surum++;
  addEventListener("hashchange", rota);
  rota();
  console.info(`Pano: ${D.nS} oturum, ${D.nA} ajan, ${D.nK} kova; JSON ayrıştırma ${tAyr.toFixed(0)} ms, ilk çizim dahil toplam ${(performance.now() - t0).toFixed(0)} ms`);
  // Genişlik değişince etkin bölümü yeniden çiz
  let sonGen = main.clientWidth, rz = 0;
  addEventListener("resize", () => {
    clearTimeout(rz);
    rz = setTimeout(() => { cizgiTasi(); const w = main.clientWidth; if (Math.abs(w - sonGen) > 24) { sonGen = w; surum++; onb.clear(); if (aktifId === "oturum") rota(); else if (aktifId) bolumCiz(aktifId); } }, 220);
  });
})();
